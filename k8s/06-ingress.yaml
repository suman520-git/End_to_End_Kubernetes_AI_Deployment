# A real Ingress controller, installed without Helm or custom resource definitions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-demo-traefik
  namespace: ai-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-demo-traefik
rules:
  - apiGroups: ['']
    resources: [services, endpoints, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-demo-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-demo-traefik
subjects:
  - kind: ServiceAccount
    name: ai-demo-traefik
    namespace: ai-demo
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: ai-demo-traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: ai-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: traefik}
  template:
    metadata:
      labels: {app: traefik}
    spec:
      serviceAccountName: ai-demo-traefik
      containers:
        - name: traefik
          image: traefik:v3.6
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=ai-demo
            - --providers.kubernetesingress.ingressclass=ai-demo-traefik
            - --entrypoints.web.address=:8080
            - --entrypoints.web.transport.respondingtimeouts.readtimeout=360s
            - --entrypoints.web.transport.respondingtimeouts.writetimeout=360s
            - --accesslog=true
            - --ping=true
            - --ping.entrypoint=web
          ports:
            - {name: web, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /ping, port: web}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: ai-demo
spec:
  selector: {app: traefik}
  ports:
    - {name: web, port: 80, targetPort: web}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-demo
  namespace: ai-demo
spec:
  ingressClassName: ai-demo-traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: {number: 8000}
