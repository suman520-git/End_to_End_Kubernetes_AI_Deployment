apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: k8s-ai-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - {name: MODEL, value: 'qwen2.5:0.5b'}
            - {name: OLLAMA_URL, value: 'http://ollama:11434'}
            - {name: REDIS_HOST, value: redis}
            - {name: PGHOST, value: postgres}
            - {name: PGDATABASE, value: aidemo}
            - {name: PGUSER, value: demo}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: database-password, key: password}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 20
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            timeoutSeconds: 3
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ai-demo
spec:
  selector: {app: api}
  ports:
    - {port: 8000, targetPort: 8000}
