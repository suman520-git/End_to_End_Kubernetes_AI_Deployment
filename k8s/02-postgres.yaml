# This script runs only when PostgreSQL first initializes an empty data volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ai-demo
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS chats (
      id BIGSERIAL PRIMARY KEY,
      question TEXT NOT NULL,
      answer TEXT NOT NULL,
      model TEXT NOT NULL,
      cached BOOLEAN NOT NULL,
      pod TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ai-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - {name: POSTGRES_USER, value: demo}
            - {name: POSTGRES_DB, value: aidemo}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: database-password, key: password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U demo -d aidemo']
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: init
          configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-demo
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
